name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.1.5

      - name: Install Haxelib dependencies
        shell: cmd
        run: |
          haxelib setup C:\haxelib
          haxelib install lime 7.7.0 --quiet
          haxelib run lime setup --quiet
          haxelib install openfl 8.9.7 --quiet
          haxelib install flixel 4.11.0 --quiet
          haxelib install flixel-addons 2.11.0 --quiet
          haxelib install flixel-ui 2.5.0 --quiet
          haxelib install hscript 2.5.0 --quiet
          haxelib install polymod 1.8.0 --quiet
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc

      - name: Build Windows executable
        run: haxelib run lime build windows -release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSPsychic-windows
          path: export/release/windows/bin/
